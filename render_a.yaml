services:
  - type: web
    name: nodo-a-top50
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_system.py"
    envVars:
      - key: PORT
        value: 10000
      - key: UNIVERSE_START
        value: "0"
      - key: UNIVERSE_END
        value: "50"
      - key: TAKE_PROFIT_PCT
        value: "9.0"
      - key: STOP_LOSS_PCT
        value: "4.0"
      - key: TRAILING_STAGE_1_LOCK
        value: "0.3"
      - key: BREAKEVEN_EXIT
        value: "0.3"
      - key: TRAILING_STAGE_2_LOCK
        value: "4.0"
      - key: TRAILING_LOCK_EXIT
        value: "3.9"
      - key: STATE_FILE_NAME
        value: "cripto_bot_estado.json"
